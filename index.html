<!doctype html>
<html lang="en">
<div class="background"> 
  <head>
    <meta charset="UTF-8" />
        <title>ResumeRadar</title>
  </head>
  <body>
<section>
    <div id="header-section">
      <h1>ResumeRadar</h1>
      <img id="rrlogo" src="ResumeRadar logo design credit user Iolco51 from Stockio.com (1).png" alt="ResumeRadar logo">
    </div>
    <div id="root"></div>
</section>


<form method="post" enctype="multipart/form-data"></form> <!-- use action attribute to send the data somewhere. insert url-->
<section>
  <div id="job-description" class="jd">
      <h2>Job Description</h2>
      <label>
        <input type="text" id="job-description-input" class="jd-input" placeholder="Paste job description here:" />
      </label>
  </div>
</section>


  <section>
    <div id="file-upload-area" class="dropArea">
        <input class="resumebutton" type="file" accept=".docx,.doc,.pdf"></input>
        <p>Or drop a file (.doc, .docx, or .pdf)</p>
      <h1>📤</h1>
      <div class="preview">
        <p>No files currently selected for upload</p>
      </div>
      <input type="submit" value="Submit" class="submitbutton"></input>
    </div>
</section>
</form>

<section>
  <button class="alterbutton">View History</button>
  <p>All rights reserved © Shi2</p>
</section>

<script type="module" src="/src/main.jsx" defer></script>
<style type="module" src="/src/App.css"></style>
  </body>
</div>
</html>
